<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to FBI Contact Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#0f1115;color:#f2f2f2;height:100dvh}
.screen{display:none;height:100%;flex-direction:column}
.screen.active{display:flex}
#welcome{align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
h1{font-size:1.6rem;font-weight:300;letter-spacing:.5px}
button{background:#4f8cff;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:1rem;cursor:pointer}
header{padding:14px 16px;background:#181b22;font-weight:400}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:10px 14px;border-radius:14px;background:#252a35;word-wrap:break-word}
.m.me{align-self:flex-end;background:#4f8cff}
form{display:flex;gap:8px;padding:12px;background:#181b22}
input{flex:1;padding:12px;border-radius:10px;border:0;background:#252a35;color:#fff;font-size:1rem}
.m img{max-width:100%;border-radius:8px;display:block;margin-top:4px}
#att{background:#252a35;padding:12px 14px}
</style>
</head>
<body>
<div id="welcome" class="screen active">
  <h1>Welcome to FBI Contact Center</h1>
  <button id="proceed">Proceed</button>
</div>
<div id="chat" class="screen">
  <header>FBI Contact Center</header>
  <div id="msgs"></div>
  <form id="f"><button type="button" id="att" title="Send photo">&#128206;</button><input id="file" type="file" accept="image/*" hidden><input id="t" placeholder="Type a message..." autocomplete="off"><button>Send</button></form>
</div>
<script>
const SUPABASE_URL = "https://znugrmhvwzszkhdxcdeh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h_4EPwruDzmwGoKwWfBNVA_kOa1-S-Y";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let sid;
try { sid = localStorage.getItem("sid"); } catch(e) {}
if (!sid) {
  sid = "u-" + Math.random().toString(36).slice(2, 10);
  try { localStorage.setItem("sid", sid); } catch(e) {}
}

const $ = id => document.getElementById(id);
async function sendImage(file, sender, session) {
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = session + "/" + Date.now() + "." + ext;
  const up = await db.storage.from("chat-images").upload(path, file, { contentType: file.type });
  if (up.error) { alert("Upload failed: " + up.error.message); return; }
  const url = db.storage.from("chat-images").getPublicUrl(path).data.publicUrl;
  const { error } = await db.from("messages").insert({ session_id: session, sender, body: "", image_url: url });
  if (error) alert("Could not send: " + error.message);
}
function fill(d, m) {
  if (m.body) d.appendChild(document.createTextNode(m.body));
  if (m.image_url) { const i = document.createElement("img"); i.src = m.image_url; d.appendChild(i); }
}

const seen = new Set();
let lastId = 0;
async function poll() {
  const { data } = await db.from("messages").select("*").eq("session_id", sid).gt("id", lastId).order("id");
  (data || []).forEach(add);
}

function add(m) {
  if (m.id > lastId) lastId = m.id;
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const d = document.createElement("div");
  d.className = "m" + (m.sender === "user" ? " me" : "");
  fill(d, m);
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

$("proceed").onclick = async () => {
  $("welcome").classList.remove("active");
  $("chat").classList.add("active");
  const { data } = await db.from("messages").select("*").eq("session_id", sid).order("created_at");
  (data || []).forEach(add);
  db.channel("c-" + sid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "session_id=eq." + sid }, p => add(p.new))
    .subscribe();
  setInterval(poll, 3000);
};

$("f").onsubmit = async e => {
  e.preventDefault();
  const body = $("t").value.trim();
  if (!body) return;
  $("t").value = "";
  const { error } = await db.from("messages").insert({ session_id: sid, sender: "user", body });
  if (error) alert("Could not send: " + error.message);
};
$("att").onclick = () => $("file").click();
$("file").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) await sendImage(f, "user", sid); };
</script>
</body>
</html>
