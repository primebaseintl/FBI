<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#0f1115;color:#f2f2f2;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;background:#181b22;font-weight:400}
#list{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#14171d}
.u{flex:none;padding:8px 14px;border-radius:20px;background:#252a35;cursor:pointer;font-size:.9rem}
.u.sel{background:#4f8cff}
.u.new::after{content:" ●";color:#ffb020}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:10px 14px;border-radius:14px;background:#252a35;word-wrap:break-word}
.m.me{align-self:flex-end;background:#4f8cff}
form{display:flex;gap:8px;padding:12px;background:#181b22}
input{flex:1;padding:12px;border-radius:10px;border:0;background:#252a35;color:#fff;font-size:1rem}
button{background:#4f8cff;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:1rem}
.m img{max-width:100%;border-radius:8px;display:block;margin-top:4px}
#att{background:#252a35;padding:12px 14px}
</style>
</head>
<body>
<header>FBI Contact Center – Admin</header>
<div id="list"></div>
<div id="msgs"><div class="m">Select a conversation above.</div></div>
<form id="f"><button type="button" id="att" title="Send photo">&#128206;</button><input id="file" type="file" accept="image/*" hidden><input id="t" placeholder="Reply..." autocomplete="off"><button>Send</button></form>
<script>
const SUPABASE_URL = "https://znugrmhvwzszkhdxcdeh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h_4EPwruDzmwGoKwWfBNVA_kOa1-S-Y";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
async function sendImage(file, sender, session) {
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = session + "/" + Date.now() + "." + ext;
  const up = await db.storage.from("chat-images").upload(path, file, { contentType: file.type });
  if (up.error) { alert("Upload failed: " + up.error.message); return; }
  const url = db.storage.from("chat-images").getPublicUrl(path).data.publicUrl;
  const { error } = await db.from("messages").insert({ session_id: session, sender, body: "", image_url: url });
  if (error) alert("Could not send: " + error.message);
}
function fill(d, m) {
  if (m.body) d.appendChild(document.createTextNode(m.body));
  if (m.image_url) { const i = document.createElement("img"); i.src = m.image_url; d.appendChild(i); }
}

const convos = {};
const unread = new Set();
let current = null;

function renderList() {
  $("list").innerHTML = "";
  Object.keys(convos).forEach(id => {
    const d = document.createElement("div");
    d.className = "u" + (id === current ? " sel" : "") + (unread.has(id) ? " new" : "");
    d.textContent = id;
    d.onclick = () => { current = id; unread.delete(id); renderList(); renderMsgs(); };
    $("list").appendChild(d);
  });
}

function renderMsgs() {
  $("msgs").innerHTML = "";
  (convos[current] || []).forEach(m => {
    const d = document.createElement("div");
    d.className = "m" + (m.sender === "admin" ? " me" : "");
    fill(d, m);
    $("msgs").appendChild(d);
  });
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

function addMsg(m) {
  const list = convos[m.session_id] = convos[m.session_id] || [];
  if (list.some(x => x.id === m.id)) return;
  list.push(m);
  if (m.session_id !== current && m.sender === "user") unread.add(m.session_id);
  renderList();
  if (m.session_id === current) renderMsgs();
}

(async () => {
  const { data } = await db.from("messages").select("*").order("created_at");
  (data || []).forEach(addMsg);
  db.channel("admin")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => addMsg(p.new))
    .subscribe();
})();

$("f").onsubmit = async e => {
  e.preventDefault();
  const body = $("t").value.trim();
  if (!body || !current) return;
  $("t").value = "";
  const { error } = await db.from("messages").insert({ session_id: current, sender: "admin", body });
  if (error) alert("Could not send: " + error.message);
};
$("att").onclick = () => { if (current) $("file").click(); };
$("file").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f && current) await sendImage(f, "admin", current); };
</script>
</body>
</html>
